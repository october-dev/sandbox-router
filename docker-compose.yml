# Self-hosted Sandbox Router with its own Postgres.
#
#   export ADMIN_TOKEN=$(openssl rand -hex 32)
#   export E2B_API_KEY=...        # and/or any other provider's keys (README.md)
#   docker compose up -d
#
# The API listens on http://localhost:8787 (reference at /docs).

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sandboxrouter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sandboxrouter"]
      interval: 5s
      timeout: 5s
      retries: 10

  sandbox-router:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sandboxrouter
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN, e.g. export ADMIN_TOKEN=$(openssl rand -hex 32)}
      # Providers: any provider without a key is not offered. See README.md for each setting.
      E2B_API_KEY: ${E2B_API_KEY:-}
      E2B_MAX_LIFETIME_HOURS: ${E2B_MAX_LIFETIME_HOURS:-1}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_TARGET: ${DAYTONA_TARGET:-}
      DAYTONA_VM: ${DAYTONA_VM:-}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      MODAL_ENVIRONMENT: ${MODAL_ENVIRONMENT:-}
      MODAL_APP_NAME: ${MODAL_APP_NAME:-}
      MODAL_IMAGE: ${MODAL_IMAGE:-}
      MODAL_DISABLE_VM: ${MODAL_DISABLE_VM:-}
      VERCEL_TOKEN: ${VERCEL_TOKEN:-}
      VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
      VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID:-}
      VERCEL_MAX_LIFETIME_HOURS: ${VERCEL_MAX_LIFETIME_HOURS:-0.75}
      VERCEL_REGION: ${VERCEL_REGION:-}
      NOVITA_API_KEY: ${NOVITA_API_KEY:-}
      NOVITA_MAX_LIFETIME_HOURS: ${NOVITA_MAX_LIFETIME_HOURS:-1}
      NOVITA_DOMAIN: ${NOVITA_DOMAIN:-}
      NOVITA_TEMPLATE_SMALL: ${NOVITA_TEMPLATE_SMALL:-}
      NOVITA_TEMPLATE_MEDIUM: ${NOVITA_TEMPLATE_MEDIUM:-}
      NOVITA_TEMPLATE_LARGE: ${NOVITA_TEMPLATE_LARGE:-}
      BOAT_API_KEY: ${BOAT_API_KEY:-}
      BOAT_MAX_LIFETIME_HOURS: ${BOAT_MAX_LIFETIME_HOURS:-2}
      BOAT_BASE_URL: ${BOAT_BASE_URL:-}
      RUN_CLOUD_API_KEY: ${RUN_CLOUD_API_KEY:-}
      RUN_CLOUD_API_URL: ${RUN_CLOUD_API_URL:-}
      RUN_CLOUD_REGION: ${RUN_CLOUD_REGION:-}
      RUN_CLOUD_IMAGE: ${RUN_CLOUD_IMAGE:-}
      MAX_RUNNING_SANDBOXES: ${MAX_RUNNING_SANDBOXES:-10}
    ports:
      # Bound to localhost only. Put a TLS proxy in front before exposing it.
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
