name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npx --yes pnpm@10.34.9 install --frozen-lockfile
      - run: npx --yes pnpm@10.34.9 typecheck
      - run: npx --yes pnpm@10.34.9 test
      - name: Build and pack the SDK
        working-directory: packages/sdk
        run: |
          npx --yes pnpm@10.34.9 build
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q 'dist/index.d.ts' pack.txt && grep -q 'LICENSE' pack.txt
      - name: Build and pack the CLI
        working-directory: packages/cli
        run: |
          npx --yes pnpm@10.34.9 build
          npx --yes pnpm@10.34.9 pack --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/sandboxrouter-cli-*.tgz -C "$RUNNER_TEMP"
          ls "$RUNNER_TEMP/package/dist/index.js" "$RUNNER_TEMP/package/README.md" "$RUNNER_TEMP/package/LICENSE"
          # The workspace dependency on the SDK must become a version range in the published package.
          node -e "const d = require(process.argv[1]).dependencies.sandboxrouter; if (!/^\^\d/.test(d)) throw new Error(d)" "$RUNNER_TEMP/package/package.json"
          node dist/index.js --help > /dev/null

  docker:
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: ci-admin-token-0123456789abcdef0123456789abcdef
      # Lets the server start; no sandbox is created, so it is never used.
      E2B_API_KEY: e2b_not_a_real_key
    steps:
      - uses: actions/checkout@v4
      - name: Start with Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Check the API
        run: |
          for i in $(seq 1 30); do curl -fsS localhost:8787/healthz && break; sleep 2; done
          curl -fsS localhost:8787/docs > /dev/null
          curl -fsS localhost:8787/openapi.json > /dev/null
          curl -fsS localhost:8787/v1/providers
          curl -fsS -X POST localhost:8787/v1/api-keys \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "Content-Type: application/json" -d '{"name": "ci"}' > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8787/v1/sandboxes)" = 401
      - name: Logs
        if: always()
        run: docker compose logs
