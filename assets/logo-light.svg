<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-label="sandbox-router">
  <style>
    .pkt { opacity: 0; animation: hop 1.8s ease-in-out infinite; }
    @keyframes hop { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: 1; } 30% { opacity: 1; transform: translateX(20px); } 34%,100% { opacity: 0; transform: translateX(20px); } }
    .screen { animation: glow 1.8s steps(1) infinite; }
    @keyframes glow { 0%,29% { fill-opacity: 1; } 30%,60% { fill: #10B981; } 61%,100% { fill-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .pkt, .screen { animation: none; } }
  </style>
