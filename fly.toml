# Fly.io config for a self-hosted Sandbox Router: the server (API and worker in one
# process, built from the Dockerfile). Postgres is attached separately; see README.md.
#
#   fly launch --copy-config --no-deploy      # pick an app name and region
#   fly postgres create --name <app>-db       # or any Postgres; then:
#   fly postgres attach <app>-db              # sets the DATABASE_URL secret
#   fly secrets set ADMIN_TOKEN=$(openssl rand -hex 32) E2B_API_KEY=...
#   fly deploy --ha=false                     # one machine (see below)
#
# Reference: https://fly.io/docs/reference/configuration/

app = "sandbox-router"
primary_region = "iad"
# The server drains on SIGTERM so running command streams can finish.
kill_signal = "SIGTERM"
kill_timeout = 300

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  # Keep the machine running: the same process runs the worker that kills sandboxes at
  # their deadline, so stopping it when idle would leave sandboxes running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
